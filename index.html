<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Где дешевле: сравнение цен в гипермаркетах Казахстана</title>
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --ink:#27323E; --muted:#6B7684; --line:#E2E8EF;
  --mint:#DAF1E7; --mint-ink:#2A7760; --mint-strong:#3C9A7E;
  --lilac:#E9E4FB; --lilac-ink:#5B4CA8;
  --peach:#FFE8DB; --peach-ink:#B0532A;
  --sky:#DDEEFB; --sky-ink:#2D6694;
  --butter:#FFF5CF;
  --shadow:0 1px 2px rgba(40,60,90,.06),0 6px 18px rgba(40,60,90,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E242B; --surface:#262D35; --surface-2:#2C343D;
    --ink:#E6ECF2; --muted:#A3AEBB; --line:#38424D;
    --mint:#2A4A40; --mint-ink:#9FE0C8; --mint-strong:#5DB596;
    --lilac:#3A3558; --lilac-ink:#C9C0F5;
    --peach:#4E3A30; --peach-ink:#FFC3A2;
    --sky:#2C4052; --sky-ink:#A9D2F2; --butter:#48432C;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E242B; --surface:#262D35; --surface-2:#2C343D;
  --ink:#E6ECF2; --muted:#A3AEBB; --line:#38424D;
  --mint:#2A4A40; --mint-ink:#9FE0C8; --mint-strong:#5DB596;
  --lilac:#3A3558; --lilac-ink:#C9C0F5;
  --peach:#4E3A30; --peach-ink:#FFC3A2;
  --sky:#2C4052; --sky-ink:#A9D2F2; --butter:#48432C;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--mint-strong);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}

/* Header */
header.top{padding:16px 0 4px}
.brandbar{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.langs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:none;background:none;border-radius:999px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink)}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;flex:0 0 auto}
h1.lead{font-size:clamp(26px,6.5vw,40px);line-height:1.08;letter-spacing:-.025em;font-weight:800;margin:18px 0 6px;max-width:17ch}
.sub{color:var(--muted);margin:0 0 16px;max-width:54ch}
.search{position:relative;display:block}
.search input{
  width:100%;border:1.5px solid var(--line);background:var(--surface);
  border-radius:16px;padding:14px 16px 14px 46px;font-size:16px;box-shadow:var(--shadow)
}
.search input:focus{outline:none;border-color:var(--mint-strong)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.note{margin:12px 0 0;font-size:13px;color:var(--muted);background:var(--butter);border-radius:12px;padding:9px 12px}

/* Chips */
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:transparent;color:var(--mint-ink);font-weight:600}
.chip .ic{margin-right:6px}
.brands{padding-top:6px}
.brands .chip{padding:6px 12px;font-size:13px}
.brands .chip[aria-pressed="true"]{background:var(--lilac);color:var(--lilac-ink)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.toolbar select,.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--peach);color:var(--peach-ink);border-color:transparent;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:8px 11px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink);font-weight:600}
.count{margin-left:auto;color:var(--muted);font-size:13px}
details.stores{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
details.stores summary{cursor:pointer;padding:8px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.stores summary::-webkit-details-marker{display:none}
details.stores summary::after{content:"＋";color:var(--muted)}
details.stores[open] summary::after{content:"－"}
.store-grid{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px}
.sbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.sbtn[aria-pressed="true"]{background:var(--sky);border-color:transparent;color:var(--sky-ink);font-weight:600}

h2.sec{font-size:22px;letter-spacing:-.015em;margin:20px 0 4px}
.sec-sub{color:var(--muted);margin:0 0 14px;font-size:14px}

/* List view */
.group{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700}
.group small{color:var(--muted);font-weight:500;font-size:13px}
.rows{display:grid;gap:6px}
@media (min-width:900px){.rows{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:7px 8px 7px 7px;min-width:0}
.row-open{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;min-width:0;border-radius:12px}
.row-open:focus-visible{outline:2.5px solid var(--mint-strong);outline-offset:2px}
.pic{border-radius:16px;display:grid;place-items:center}
.pic.sm{width:48px;height:48px;font-size:26px;border-radius:12px;flex:0 0 auto}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.brand-tag{font-size:11.5px;font-weight:600;background:var(--lilac);color:var(--lilac-ink);border-radius:6px;padding:1px 6px}
.qty-tag{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:0 6px}
.sale-tag{font-size:11.5px;font-weight:700;background:var(--peach);color:var(--peach-ink);border-radius:6px;padding:1px 6px}
.rr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rp{text-align:right;display:flex;flex-direction:column;line-height:1.2}
.rp .price{font-size:16px}
.add-sm{width:38px;height:38px;border-radius:12px;border:none;background:var(--mint);color:var(--mint-ink);font-weight:800;font-size:18px}
.add-sm.in{background:var(--mint-strong);color:#fff;font-size:15px}

/* Grid view */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1;min-width:0;border-radius:14px}
.card-open:focus-visible{outline:2.5px solid var(--mint-strong);outline-offset:3px}
.card .pic{height:84px;font-size:44px;margin-bottom:10px}
.card h3{font-size:14px;font-weight:600;margin:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .meta{margin:4px 0 8px}
.best{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-weight:800;font-size:19px;letter-spacing:-.01em}
.where{font-size:12px;color:var(--mint-ink);font-weight:600}
.range{font-size:12px;color:var(--muted);margin-top:2px}
.fav{position:absolute;top:18px;right:18px;border:none;background:var(--surface);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow);z-index:1}
.fav[aria-pressed="true"]{color:#D9607A}
.card .sale-tag{position:absolute;top:20px;left:20px;z-index:1}
.add{margin-top:10px;border:none;border-radius:12px;padding:9px;background:var(--mint);color:var(--mint-ink);font-weight:600;font-size:14px}
.add.in{background:var(--mint-strong);color:#fff}
.strip{position:relative;height:14px;margin:8px 2px 0}
.strip::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--mint-strong),var(--line) 50%,#E7A58A)}
.strip i{position:absolute;top:3px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface);transform:translateX(-50%)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--surface);border-radius:22px;border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty button{margin-top:12px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:none;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:12px;position:relative;min-width:0}
.tab span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .ti{font-size:20px;line-height:1}
.tab[aria-current="page"]{color:var(--mint-ink);background:var(--mint);font-weight:600}
.badge[hidden]{display:none}
.badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--peach-ink);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(30,40,55,.35);z-index:30;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:26px 26px 0 0;max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .28s ease;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
@media (min-width:720px){
  .sheet{left:50%;right:auto;width:660px;bottom:auto;top:50%;border-radius:26px;transform:translate(-50%,-44%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-head .pic{width:74px;height:74px;flex:0 0 auto;font-size:40px}
.sh-head h3{margin:0;font-size:18px;line-height:1.25}
.close{margin-left:auto;align-self:flex-start;border:none;background:var(--surface-2);border-radius:50%;width:36px;height:36px;font-size:17px;flex:0 0 auto}
.sh-title{font-size:15px;font-weight:700;margin:20px 0 8px}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:96px 1fr auto 34px;gap:8px;align-items:center;font-size:14px}
.rung .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:26px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--sky)}
.rung.win .bar span{background:var(--mint-strong)}
.rung.win .pr{color:var(--mint-ink)}
.rung .pr{font-weight:700;text-align:right;min-width:74px}
.rung .old{display:block;font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:400}
.rung.na{opacity:.5}
.rung-add{width:34px;height:34px;border-radius:10px;border:none;background:var(--mint);color:var(--mint-ink);font-weight:800;font-size:17px}
.chart{width:100%;height:auto;display:block}
.chart-cap{font-size:13px;color:var(--muted);margin-top:4px}
.sh-actions{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;border:none;border-radius:14px;padding:13px 14px;font-weight:700;font-size:15px}
.btn.pri{background:var(--mint-strong);color:#fff}
.btn.sec{background:var(--surface-2);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.saving{margin-top:12px;background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:10px 12px;font-size:14px}

/* Cart & panels */
.two{display:grid;gap:14px}
.two>*{min-width:0}
main{overflow-x:clip}
@media (min-width:900px){.two{grid-template-columns:1.15fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14px}
.sgroup-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.sgroup-h .sum{margin-left:auto}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ci .pic.sm{width:42px;height:42px;font-size:22px}
.ci .t{flex:1;min-width:0}
.ci .t b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.ci{align-items:flex-start}
.ci .tl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ci .ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.ci select{min-width:0;flex:1 1 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 6px;font-size:12.5px;max-width:100%}
.qty{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
.qty span{min-width:20px;text-align:center;font-weight:700}
.ci .lsum{white-space:nowrap;font-weight:700;font-size:14px}
.total-rung{grid-template-columns:96px 1fr auto auto}
.miss{display:block;font-size:11px;color:var(--peach-ink);font-weight:500}
.take{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.take:disabled{opacity:.4}
.lines{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .grand{font-size:20px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.bigsum{font-size:26px;font-weight:800;letter-spacing:-.02em}
.clear{border:none;background:none;color:var(--peach-ink);font-weight:600;padding:4px 0}
.order-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.order-item small{color:var(--muted);display:block}
.status{background:var(--mint);color:var(--mint-ink);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}

/* Stores */
.store-cards{display:grid;gap:10px}
@media (min-width:640px){.store-cards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.store-cards{grid-template-columns:repeat(3,1fr)}}
.store-card{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.store-card:focus-visible{outline:2.5px solid var(--mint-strong)}
.store-card .hd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.store-av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#2B3440}
.store-card .hd .cnt{margin-left:auto;font-size:13px;font-weight:600;background:var(--mint);color:var(--mint-ink);border-radius:999px;padding:3px 10px}
.store-card .hd .cnt.zero{background:var(--surface-2);color:var(--muted)}
.store-card small{color:var(--muted)}
.back{border:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;margin-top:14px}
.store-hero{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.store-hero .store-av{width:52px;height:52px;font-size:20px;border-radius:16px}
.store-hero h2{margin:0;font-size:24px}
.inline-search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:15px;margin-bottom:10px}

/* Checkout */
.co{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.co.open{display:block}
.co-top{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 0 8px;border-bottom:1px solid var(--line)}
.co-top .wrap{display:flex;align-items:center;gap:10px;max-width:720px}
.co-top h2{margin:0;font-size:18px}
.co .wrap.body{max-width:720px}
.steps{display:flex;gap:6px;margin:14px 0 6px}
.steps div{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.steps div::before{content:"";height:5px;border-radius:5px;background:var(--line)}
.steps div.on{color:var(--mint-ink);font-weight:600}
.steps div.on::before{background:var(--mint-strong)}
.co-bar{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.co-bar .wrap{display:flex;gap:10px;align-items:center;max-width:720px}
.co-bar .tot{margin-right:auto;line-height:1.15}
.co-bar .tot small{color:var(--muted);display:block;font-size:12px}
.co-bar .tot b{font-size:20px}
.co-bar .btn{flex:0 0 auto;min-width:150px}
.order-no{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fields .full{grid-column:1/-1}
.fields.four{grid-template-columns:repeat(3,1fr)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--mint-strong)}
label.f textarea{resize:vertical;min-height:64px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;align-items:center;gap:10px}
.opt[aria-pressed="true"]{border-color:var(--mint-strong);background:var(--mint)}
.opt .oi{font-size:22px}
.opt b{display:block;font-size:14.5px}
.opt small{color:var(--muted);font-size:12px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.days .chip{text-align:center;line-height:1.2}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:14px;font-weight:600}
.slot[aria-pressed="true"]{border-color:var(--mint-strong);background:var(--mint);color:var(--mint-ink)}
.slot:disabled{opacity:.4;text-decoration:line-through}
.pays{display:grid;gap:8px}
.w-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.err{background:var(--peach);color:var(--peach-ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}
.info{background:var(--sky);color:var(--sky-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:56px}
.done h2{margin:8px 0 4px;font-size:26px}
.done .lines{text-align:left;margin-top:18px}
.saved-addr{border:1px dashed var(--mint-strong);background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600;margin-bottom:10px;width:100%;text-align:left}

footer{color:var(--muted);font-size:12.5px;padding:30px 0 10px;max-width:62ch}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>

function fdate(d,o){ // o: {day, month:"long"|"short", weekday, time}
  if(L!=="kk") return d.toLocaleString(LOC[L],{...(o.day?{day:"numeric"}:{}),...(o.month?{month:o.month}:{}),...(o.weekday?{weekday:"short"}:{}),...(o.time?{hour:"2-digit",minute:"2-digit"}:{})});
  const parts=[];
  if(o.weekday) parts.push(KK_W[d.getDay()]);
  if(o.day) parts.push(d.getDate()+(o.month?" "+(o.month==="short"?KK_M[d.getMonth()].slice(0,3):KK_M[d.getMonth()]):""));
  let s=parts.join(", ");
  if(o.time) s+=", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return s;
}

/* Детерминированный генератор: цены стабильны между заходами */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rnd(s){let x=hash(s);x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%10000)/10000}
function roundP(v){return v>=1000?Math.round(v/10)*10:Math.round(v/5)*5}

const PRODUCTS = V.map((r,i)=>{
  const [type,brand,attr,qty,unit,base]=r;
  const id="p"+i, ty=TYPES[type];
  const prices={};
  STORES.forEach(s=>{
    const key=id+type+s.id;
    if(rnd(key+"a")>s.avail) return;
    let p=roundP(base*s.k*(0.93+rnd(key+"p")*0.14)), old=null;
    if(rnd(key+"s")<0.11){ old=p; p=roundP(p*(1-(0.10+rnd(key+"d")*0.25))); }
    prices[s.id]={price:p,old};
  });
  STORES.forEach(s=>{ if(Object.keys(prices).length<4 && !prices[s.id]) prices[s.id]={price:roundP(base*s.k),old:null}; });
  const attrs=Array.isArray(attr)?attr:[attr,attr,attr];
  const hay=[ty[1],ty[2],ty[3],brand,...attrs].join(" ").toLowerCase();
  return {id,type,cat:ty[0],emoji:ty[4],brand,attr:attrs,qty,unit,base,prices,hay};
});
const PROD = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));

/* ================= УТИЛИТЫ ================= */
function t(k,v){let s=I18N[L][k]; if(s===undefined) s=I18N.ru[k]; if(typeof s==="string"&&v) s=s.replace(/\{(\w+)\}/g,(_,x)=>v[x]??""); return s;}
function pl(n,k){const f=I18N[L][k]; if(L==="ru"){const a=Math.abs(n)%100,b=a%10; if(a>10&&a<20)return f[2]; if(b>1&&b<5)return f[1]; if(b===1)return f[0]; return f[2];} if(L==="en") return n===1?f[0]:f[1]; return f[0];}
function nf(n){return new Intl.NumberFormat(LOC[L]).format(n)}
function fmt(n){return nf(Math.round(n))+"\u00a0₸"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dec(s){return L==="en"?s:s.replace(/(\d)\.(\d)/g,"$1,$2")}
function locUnits(s){ // единицы внутри характеристик: "60 l", "26 cm", "2000 W"
  if(L==="en") return s.replace(/(\d),(\d)/g,"$1.$2");
  const m=L==="kk"?{l:"л",cm:"см",mm:"мм",W:"Вт",kg:"кг"}:{l:"л",cm:"см",mm:"мм",W:"Вт",kg:"кг"};
  return s.replace(/(\d)\s(l|cm|mm|W|kg)\b/g,(_,d,u)=>d+" "+m[u]);
}
const catName=c=>CAT[c].n[LI[L]];
function pTitle(p){const a=p.attr[LI[L]]; return TYPES[p.type][LI[L]+1]+(a?" "+locUnits(a):"")}
function pFull(p){const a=p.attr[LI[L]]; return [TYPES[p.type][LI[L]+1],p.brand,a?locUnits(a):""].filter(Boolean).join(" ")}
function pQty(p){return dec(String(p.qty))+"\u00a0"+t("u_"+p.unit)}
function metaTags(p,sale){
  return `<span class="meta">${p.brand?`<span class="brand-tag">${esc(p.brand)}</span>`:""}<span class="qty-tag">${pQty(p)}</span>${sale?`<span class="sale-tag">−${sale}%</span>`:""}</span>`;
}

function offers(p,all){
  return Object.entries(p.prices).filter(([sid])=>all||state.stores.has(sid)).map(([sid,o])=>({sid,...o})).sort((a,b)=>a.price-b.price);
}
function stats(p){
  const o=offers(p); if(!o.length) return null;
  const min=o[0].price,max=o[o.length-1].price;
  const promo=o.filter(x=>x.old).sort((a,b)=>(b.old-b.price)/b.old-(a.old-a.price)/a.old)[0]||null;
  return {o,min,max,best:o[0],diff:max-min,promo,salePct:promo?Math.round((promo.old-promo.price)/promo.old*100):0};
}
function cheapestSid(p){const s=stats(p); return s?s.best.sid:offers(p,true)[0].sid}
function history(p){
  const s=stats(p), now=s?s.min:p.base, pts=[];
  for(let i=0;i<8;i++) pts.push(i===7?now:roundP(now*(1+(rnd(p.id+"h"+i)-0.45)*0.14)));
  return pts;
}
function promoEnd(){const d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7||7)); return fdate(d,{day:1,month:"long"})}
const cartQty=pid=>state.cart[pid]?.q||0;
const itemPrice=(pid)=>{const it=state.cart[pid]; return PROD[pid].prices[it.s].price};
function storeGroups(){
  const g={};
  for(const pid of Object.keys(state.cart)){ const s=state.cart[pid].s; (g[s]=g[s]||[]).push(pid); }
  return g;
}
function storeSub(sid,pids){return pids.reduce((a,pid)=>a+itemPrice(pid)*state.cart[pid].q,0)}
function feeFor(sid,sub,mode){const s=STORE[sid]; if(mode==="pickup"&&s.pickup) return 0; if(!s.fee||sub>=s.freeFrom) return 0; return s.fee}
function persist(){save("gd_cart2",state.cart);save("gd_fav",[...state.fav]);save("gd_stores",[...state.stores]);save("gd_view",state.view);save("gd_orders",state.orders)}

const main=document.getElementById("main"), hero=document.getElementById("hero");

function row(p, sid){
  let right;
  if(sid){
    const o=p.prices[sid];
    const sale=o.old?Math.round((o.old-o.price)/o.old*100):0;
    right=`<span class="rp"><span class="price num">${fmt(o.price)}</span>${o.old?`<small class="num" style="text-decoration:line-through;color:var(--muted)">${fmt(o.old)}</small>`:""}</span>`;
    const q=state.cart[p.id]&&state.cart[p.id].s===sid?state.cart[p.id].q:0;
    return `<div class="row">
      <button class="row-open" data-open="${p.id}"><span class="pic sm" style="background:${CAT[p.cat].tint}" aria-hidden="true">${p.emoji}</span>
        <span class="rt"><b>${esc(pTitle(p))}</b>${metaTags(p,sale)}</span></button>
      <span class="rr">${right}<button class="add-sm ${q?"in":""}" data-addfrom="${p.id}|${sid}" aria-label="${esc(t("addFrom",{s:STORE[sid].name}))}">${q||"+"}</button></span>
    </div>`;
  }
  const s=stats(p), q=cartQty(p.id);
  right=s?`<span class="rp"><span class="price num">${fmt(s.min)}</span><span class="where">${STORE[s.best.sid].name}</span></span>`:`<small style="color:var(--muted);max-width:90px;text-align:right">${t("notInSelected")}</small>`;
  return `<div class="row">
    <button class="row-open" data-open="${p.id}"><span class="pic sm" style="background:${CAT[p.cat].tint}" aria-hidden="true">${p.emoji}</span>
      <span class="rt"><b>${esc(pTitle(p))}</b>${metaTags(p,s?s.salePct:0)}</span></button>
    <span class="rr">${right}<button class="add-sm ${q?"in":""}" data-add="${p.id}" aria-label="${esc(t("toCart"))}">${q||"+"}</button></span>
  </div>`;
}

function card(p, extra=""){
  const s=stats(p), q=cartQty(p.id), fav=state.fav.has(p.id);
  let body;
  if(!s) body=`<div class="range">${t("notInSelected")}</div>`;
  else{
    const dots=s.o.map(x=>{const pos=s.max===s.min?50:((x.price-s.min)/(s.max-s.min))*100;
      return `<i style="left:${pos}%;background:${STORE[x.sid].color}" title="${STORE[x.sid].name}: ${fmt(x.price)}"></i>`}).join("");
    body=`<div class="best"><span class="price num">${fmt(s.min)}</span><span class="where">${STORE[s.best.sid].name}</span></div>
      <div class="range num">${s.o.length>1?t("upTo",{x:fmt(s.max),y:fmt(s.diff)}):t("oneStore")}</div>${extra}
      <div class="strip" aria-hidden="true">${dots}</div>`;
  }
  return `<article class="card">
    ${s&&s.promo?`<span class="sale-tag">−${s.salePct}%</span>`:""}
    <button class="fav" data-fav="${p.id}" aria-pressed="${fav}" aria-label="${esc(fav?t("favRemove"):t("favAdd"))}">${fav?"♥":"♡"}</button>
    <button class="card-open" data-open="${p.id}">
      <div class="pic" style="background:${CAT[p.cat].tint}" aria-hidden="true">${p.emoji}</div>
      <h3>${esc(pTitle(p))}</h3>${metaTags(p,0)}${body}
    </button>
    <button class="add ${q?"in":""}" data-add="${p.id}">${q?t("inCart",{n:q}):t("toCart")}</button>
  </article>`;
}

function filtered(){
  const q=state.q.trim().toLowerCase();
  let list=PRODUCTS.filter(p=>(state.cat==="all"||p.cat===state.cat)&&(!state.brand||p.brand===state.brand)&&(!q||p.hay.includes(q)||catName(p.cat).toLowerCase().includes(q)));
  if(state.onlyPromo) list=list.filter(p=>{const s=stats(p);return s&&s.promo});
  const mn=p=>stats(p)?.min, sorters={
    cheap:(a,b)=>(mn(a)??1e9)-(mn(b)??1e9),
    expensive:(a,b)=>(mn(b)??0)-(mn(a)??0),
    saving:(a,b)=>((stats(b)?.diff??0)/(stats(b)?.max||1))-((stats(a)?.diff??0)/(stats(a)?.max||1)),
    name:(a,b)=>pFull(a).localeCompare(pFull(b),LOC[L])
  };
  return list.sort(sorters[state.sort]);
}

          <div class="ladder">${totals.map(x=>`
            <div class="rung total-rung ${win&&x.s.id===win.s.id?"win":""} ${x.miss?"na":""}">
              <span class="nm"><span class="dot" style="background:${x.s.color}"></span>${x.s.name}</span>
              <div class="bar"><span style="width:${Math.max(8,x.sum/maxSum*100)}%"></span></div>
              <span class="pr num">${fmt(x.sum)}${x.miss?`<span class="miss">${t("missing",{n:x.miss})}</span>`:""}</span>
              <button class="take" data-moveall="${x.s.id}" ${x.miss?"disabled":""}>${t("takeHere")}</button>
            </div>`).join("")}</div>
        </section>
        <section class="panel">
          <h3>${t("optT")}</h3>
          <p>${canOpt?t("optX")+" "+t("optSave",{x:fmt(goods-opt)}):t("optDone")}</p>
          <div class="bigsum num">${fmt(opt)}</div>
          ${canOpt?`<div class="sh-actions"><button class="btn sec" data-optimize>${t("optBtn")}</button></div>`:""}
        </section>
        ${ordersHTML()}
      </div>
    </div>`;
}

const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let lastFocus=null, openId=null;
function chartSVG(pts){
  const W=600,H=150,P=24, min=Math.min(...pts), max=Math.max(...pts), span=max-min||1;
  const xy=pts.map((v,i)=>[P+i*(W-2*P)/(pts.length-1), H-P-(v-min)/span*(H-2*P)]);
  const line=xy.map(p=>p.join(",")).join(" ");
  const labels=[t("w8"),"","",t("w4"),"","","",t("now")];
  return `<svg class="chart" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="${esc(t("chartT"))}">
    <polygon points="${P},${H-P} ${line} ${W-P},${H-P}" fill="var(--mint)" opacity=".7"/>
    <polyline points="${line}" fill="none" stroke="var(--mint-strong)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===7?6:3.5}" fill="${i===7?"var(--mint-strong)":"var(--surface)"}" stroke="var(--mint-strong)" stroke-width="2"/>`).join("")}
    <text x="${xy[7][0]}" y="${Math.max(16,xy[7][1]-12)}" text-anchor="end" font-size="15" font-weight="700" fill="var(--ink)">${fmt(pts[7])}</text>
    ${labels.map((l,i)=>l?`<text x="${xy[i][0]}" y="${H+10}" text-anchor="${i===0?"start":i===7?"end":"middle"}" font-size="13" fill="var(--muted)">${l}</text>`:"").join("")}
  </svg>`;
}
function openSheet(id){

  const min=sel.length?sel[0].price:0, max=all.length?all[all.length-1].price:1;
  const missing=STORES.filter(s=>!p.prices[s.id]);
  const h=history(p), q=cartQty(id), fav=state.fav.has(id);

          <span class="nm"><span class="dot" style="background:${STORE[o.sid].color}"></span>${STORE[o.sid].name}</span>

        </div>`}).join("")}
      ${missing.map(s=>`<div class="rung na"><span class="nm"><span class="dot" style="background:${s.color}"></span>${s.name}</span><div class="bar"></div><span class="pr" style="font-weight:400;font-size:12px">${t("noStock")}</span><span></span></div>`).join("")}
    </div>

    <div class="sh-title">${t("chartT")}</div>
    ${chartSVG(h)}
    <div class="chart-cap">${t("chartCap",{a:fmt(Math.min(...h)),b:fmt(Math.max(...h))})}</div>
    <div class="sh-actions">
      <button class="btn sec" data-fav="${id}" aria-pressed="${fav}">${fav?"♥ "+t("inFav"):"♡ "+t("favAdd")}</button>
      <button class="btn pri" data-add="${id}">${q?t("inCartMore",{n:q}):t("addCart")}</button>
    </div>`;
  if(!sheet.classList.contains("open")){
    lastFocus=document.activeElement;
    scrim.classList.add("open"); sheet.classList.add("open");

/* ================= ОФОРМЛЕНИЕ ЗАКАЗА ================= */
const coEl=document.getElementById("co");
const SLOTS=[9,11,13,15,17,19,21];
const WALLETS=[
  {id:"kaspi",name:"Kaspi Pay",bg:"#F6B3A6",ic:"K"},
  {id:"halyk",name:"Halyk Pay (Homebank)",bg:"#A9DDC4",ic:"H"},
  {id:"apple",name:"Apple Pay",bg:"#D5DBE3",ic:""},
  {id:"google",name:"Google Pay",bg:"#BFD7F5",ic:"G"}
];
function startCheckout(scope){
  const stores=scope==="all"?Object.keys(storeGroups()):[scope];
  if(!stores.length) return;
  const a=load("gd_addr",null);
  state.co={step:1,scope,stores,no:String(100000+Math.floor(Math.random()*900000)),
    mode:"delivery",city:0,street:"",house:"",apt:"",entrance:"",floor:"",comment:"",phone:"+7 ",
    day:0,slot:null,pay:null,err:"",saved:a};

}
function closeCo(){coEl.classList.remove("open");document.body.style.overflow="";state.co=null;render();}
function coGroups(){
  const g=storeGroups(), co=state.co;
  return co.stores.filter(s=>g[s]).map(sid=>{const ids=g[sid], sub=storeSub(sid,ids); return {sid,ids,sub,fee:feeFor(sid,sub,co.mode)}});
}
function needAddress(){const co=state.co; return co.mode==="delivery"||co.stores.some(s=>!STORE[s].pickup)}
function dayDate(d){const x=new Date(); x.setDate(x.getDate()+d); return x}
function dayLabel(d){ if(d===0) return t("today"); if(d===1) return t("tomorrow"); return fdate(dayDate(d),{weekday:1}); }
function slotText(h){return `${String(h).padStart(2,"0")}:00–${String(h+2).padStart(2,"0")}:00`}
function slotDisabled(d,h){return d===0 && h<=new Date().getHours()+1}
function whenText(){const co=state.co; return `${fdate(dayDate(co.day),{day:1,month:"long"})}, ${slotText(co.slot)}`}
function addrText(a){return [I18N[L].cities[a.city],a.street,a.house&&(L==="en"?"bldg ":L==="kk"?"үй ":"д. ")+a.house,a.apt&&(L==="en"?"apt ":L==="kk"?"пәтер ":"кв. ")+a.apt].filter(Boolean).join(", ")}
function payName(id){return id==="card"?t("cardT"):WALLETS.find(w=>w.id===id)?.name}

function renderCo(){
  const co=state.co; if(!co) return;
  const groups=coGroups();
  if(!groups.length && co.step<4){closeCo();return;}
  const goods=groups.reduce((a,g)=>a+g.sub,0), fees=groups.reduce((a,g)=>a+g.fee,0), total=goods+fees;
  co.total=total;
  const steps=[t("stepOrder"),t("stepDelivery"),t("stepPay")];
  let body="", barBtn="";
  if(co.step===1){
    body=`${groups.map(g=>`<section class="panel">
      <div class="sgroup-h"><span class="dot" style="background:${STORE[g.sid].color}"></span>${STORE[g.sid].name}<span class="sum num">${fmt(g.sub)}</span></div>
      ${g.ids.map(pid=>{const p=PROD[pid],it=state.cart[pid];return `<div class="order-item"><div>${esc(pFull(p))}<small>${pQty(p)}, ${it.q} × ${fmt(itemPrice(pid))}</small></div><b class="num">${fmt(itemPrice(pid)*it.q)}</b></div>`}).join("")}
      <div class="order-item"><span>${t("delivery")}</span><b class="num">${g.fee?fmt(g.fee):t("free")}</b></div>
    </section>`).join("")}
    <section class="panel"><div class="lines">
      <div><span>${t("goods")}</span><b class="num">${fmt(goods)}</b></div>
      <div><span>${t("delivery")}</span><b class="num">${fees?fmt(fees):t("free")}</b></div>
      <div class="grand"><span>${t("total")}</span><span class="num">${fmt(total)}</span></div></div></section>`;
    barBtn=`<button class="btn pri" data-co="next">${t("next")}</button>`;
  }else if(co.step===2){
    const cities=I18N[L].cities.map((c,i)=>`<option value="${i}" ${i==co.city?"selected":""}>${c}</option>`).join("");
    const noPick=co.mode==="pickup"?co.stores.filter(s=>!STORE[s].pickup):[];
    body=`<div class="modes">
        <button class="opt" data-mode="delivery" aria-pressed="${co.mode==="delivery"}"><span class="oi">🚚</span><span><b>${t("modeDelivery")}</b><small>${t("modeDeliveryX")}</small></span></button>
        <button class="opt" data-mode="pickup" aria-pressed="${co.mode==="pickup"}"><span class="oi">🏬</span><span><b>${t("modePickup")}</b><small>${t("modePickupX")}</small></span></button>
      </div>
      ${co.mode==="pickup"?`<div class="info">${t("pickupNote")}${noPick.map(s=>`<br>${t("noPickupNote",{s:STORE[s].name})}`).join("")}</div>`:""}
      <section class="panel" style="margin-top:12px">
        <h3 style="margin-bottom:10px">${needAddress()?t("addrT"):t("phone")}</h3>
        ${needAddress()&&co.saved&&co.saved.street?`<button class="saved-addr" data-useaddr>📍 ${esc(t("savedAddr",{a:addrText(co.saved)}))}</button>`:""}
        <div class="fields">
          ${needAddress()?`
          <label class="f full">${t("city")}<select data-f="city">${cities}</select></label>
          <label class="f full">${t("street")}<input data-f="street" value="${esc(co.street)}" autocomplete="address-line1"></label>
          <label class="f">${t("house")}<input data-f="house" value="${esc(co.house)}"></label>
          <label class="f">${t("apt")}<input data-f="apt" value="${esc(co.apt)}" inputmode="numeric"></label>
          <label class="f">${t("entrance")}<input data-f="entrance" value="${esc(co.entrance)}" inputmode="numeric"></label>
          <label class="f">${t("floor")}<input data-f="floor" value="${esc(co.floor)}" inputmode="numeric"></label>
          <label class="f full">${t("comment")}<textarea data-f="comment">${esc(co.comment)}</textarea></label>`
          :`<label class="f full">${t("city")}<select data-f="city">${cities}</select></label>`}
          <label class="f full">${t("phone")}<input data-f="phone" type="tel" inputmode="tel" value="${esc(co.phone)}" autocomplete="tel" placeholder="+7 (7__) ___-__-__"></label>
        </div>
      </section>
      <section class="panel">
        <h3 style="margin-bottom:10px">${t("timeT")}</h3>
        <div class="days">${[0,1,2,3,4].map(d=>`<button class="chip" data-day="${d}" aria-pressed="${co.day===d}">${dayLabel(d)}<br><small>${fdate(dayDate(d),{day:1,month:"short"})}</small></button>`).join("")}</div>
        <div class="slots">${SLOTS.map(h=>`<button class="slot num" data-slot="${h}" aria-pressed="${co.slot===h}" ${slotDisabled(co.day,h)?"disabled":""}>${slotText(h)}</button>`).join("")}</div>
      </section>
      ${co.err?`<div class="err" role="alert">${co.err}</div>`:""}`;
    barBtn=`<button class="btn pri" data-co="next">${t("next")}</button>`;
  }else if(co.step===3){
    body=`<section class="panel"><div class="lines">
        <div><span>${t("whenLbl")}</span><b>${esc(whenText())}</b></div>
        <div><span>${t("whereLbl")}</span><b style="text-align:right">${esc(needAddress()?addrText(co):t("pickupAt"))}</b></div>
      </div></section>
      <h3 style="margin:18px 0 8px">${t("payT")}</h3>
      <div class="pays">
        <button class="opt" data-pay="card" aria-pressed="${co.pay==="card"}"><span class="w-ic" style="background:var(--lilac);color:var(--lilac-ink)">💳</span><span><b>${t("cardT")}</b><small>${t("cardX")}</small></span></button>
      </div>
      <h3 style="margin:18px 0 8px">${t("walletsT")}</h3>
      <div class="pays">${WALLETS.map(w=>`<button class="opt" data-pay="${w.id}" aria-pressed="${co.pay===w.id}"><span class="w-ic" style="background:${w.bg};color:#2B3440">${w.ic||"◉"}</span><span><b>${w.name}</b></span></button>`).join("")}</div>
      <div class="info">${t("demoPay")}</div>
      ${co.err?`<div class="err" role="alert">${co.err}</div>`:""}`;
    barBtn=`<button class="btn pri" data-co="pay">${t("payBtn",{x:fmt(total)})}</button>`;
  }else{
    const o=co.done;
    body=`<div class="done"><div class="big" aria-hidden="true">✅</div><h2>${t("doneT")}</h2><p style="color:var(--muted)">${t("doneX",{n:o.no})}</p>
      <section class="panel"><div class="lines">
        <div><span>${t("storeLbl")}</span><b>${o.stores.map(s=>STORE[s].name).join(", ")}</b></div>
        <div><span>${t("whenLbl")}</span><b>${esc(o.when)}</b></div>
        <div><span>${t("whereLbl")}</span><b style="text-align:right">${esc(o.where)}</b></div>
        <div><span>${t("payLbl")}</span><b>${esc(payName(o.pay))}</b></div>
        <div class="grand"><span>${t("total")}</span><span class="num">${fmt(o.total)}</span></div>
      </div></section></div>`;
    barBtn=`<button class="btn pri" data-co="finish">${t("doneBack")}</button>`;
  }
  coEl.setAttribute("aria-label",t("coTitle"));
  coEl.innerHTML=`<div class="co-top"><div class="wrap">
      ${co.step>1&&co.step<4?`<button class="close" data-co="back" aria-label="${t("back")}" style="margin:0">←</button>`:""}
      <div><h2>${t("coTitle")}</h2><div class="order-no">${t("orderNo",{n:co.no})}</div></div>
      <button class="close" data-co="close" aria-label="✕">✕</button>
    </div></div>
    <div class="wrap body">
      ${co.step<4?`<div class="steps">${steps.map((s,i)=>`<div class="${i<co.step?"on":""}">${s}</div>`).join("")}</div>`:""}
      ${body}
    </div>
    <div class="co-bar"><div class="wrap">
      ${co.step<4?`<div class="tot"><small>${t("toPay")}</small><b class="num">${fmt(total)}</b></div>`:`<span style="margin-right:auto"></span>`}
      ${barBtn}
    </div></div>`;
}
function phoneDigits(s){let d=s.replace(/\D/g,""); if(d.startsWith("8")) d="7"+d.slice(1); if(!d.startsWith("7")) d="7"+d; return d.slice(0,11)}
function phoneFmt(d){const r=d.slice(1); let s="+7"; if(r.length) s+=" ("+r.slice(0,3); if(r.length>=3) s+=")"; if(r.length>3) s+=" "+r.slice(3,6); if(r.length>6) s+="-"+r.slice(6,8); if(r.length>8) s+="-"+r.slice(8,10); return s}
function coNext(){
  const co=state.co; co.err="";
  if(co.step===2){
    if(needAddress()&&(!co.street.trim()||!co.house.trim())) co.err=t("errAddr");
    else if(phoneDigits(co.phone).length<11) co.err=t("errPhone");
    else if(co.slot===null||slotDisabled(co.day,co.slot)) co.err=t("errTime");
    if(co.err){renderCo();return;}
  }
  co.step++; renderCo(); coEl.scrollTo({top:0});
}
function coPay(){
  const co=state.co;
  if(!co.pay){co.err=t("errPay");renderCo();return;}
  const groups=coGroups();
  const order={no:co.no,ts:Date.now(),stores:groups.map(g=>g.sid),total:co.total,when:whenText(),where:needAddress()?addrText(co):t("pickupAt"),pay:co.pay};
  state.orders.unshift(order);
  if(needAddress()) save("gd_addr",{city:co.city,street:co.street,house:co.house,apt:co.apt,entrance:co.entrance,floor:co.floor,phone:co.phone});
  groups.forEach(g=>g.ids.forEach(pid=>delete state.cart[pid]));
  persist();
  co.done=order; co.step=4; co.err=""; renderCo(); coEl.scrollTo({top:0});
}

/* ================= СОБЫТИЯ ================= */
let toastT;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1700)}
function addToCart(pid,sid){
  const it=state.cart[pid];
  if(it){ it.q++; if(sid) it.s=sid; }
  else state.cart[pid]={q:1,s:sid||cheapestSid(PROD[pid])};
  toast(t("tAdded",{n:pFull(PROD[pid])}));
}
function rerender(){persist(); render(); if(openId) openSheet(openId);}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b){ if(e.target===scrim) closeSheet(); return; }
  const d=b.dataset;

  // оформление заказа
  if(state.co && coEl.contains(b)){
    const co=state.co;
    if(d.co==="close"||d.co==="finish"){ if(d.co==="finish") state.view="catalog"; closeCo(); return; }
    if(d.co==="back"){co.step--;co.err="";renderCo();return;}
    if(d.co==="next"){coNext();return;}
    if(d.co==="pay"){coPay();return;}
    if(d.mode){co.mode=d.mode;co.err="";renderCo();return;}
    if(d.day!==undefined){co.day=+d.day; if(co.slot!==null&&slotDisabled(co.day,co.slot)) co.slot=null; renderCo();return;}
    if(d.slot){co.slot=+d.slot;co.err="";renderCo();return;}
    if(d.pay){co.pay=d.pay;co.err="";renderCo();return;}
    if(d.useaddr!==undefined){Object.assign(co,{city:co.saved.city,street:co.saved.street,house:co.saved.house,apt:co.saved.apt||"",entrance:co.saved.entrance||"",floor:co.saved.floor||"",phone:co.saved.phone||co.phone});renderCo();return;}
    return;
  }

  if(d.lang){L=d.lang;save("gd_lang",L);applyStatic();render();if(openId)openSheet(openId);return;}
  if(b.id==="themeBtn"){toggleTheme();return;}
  if(d.close!==undefined){closeSheet();return;}
  if(d.open){openSheet(d.open);return;}
  if(d.view){state.view=d.view;state.storeId=null;window.scrollTo({top:0});}
  else if(d.go){state.view=d.go;}
  else if(d.storeopen){state.view="store";state.storeId=d.storeopen;state.storeQ="";window.scrollTo({top:0});}
  else if(d.cat){state.cat=d.cat;state.brand=null; if(d.cat==="all") state.layout="list";}
  else if(d.brand!==undefined){state.brand=d.brand||null;}
  else if(d.layout){state.layout=d.layout;}
  else if(d.add){addToCart(d.add);}
  else if(d.addfrom){const [pid,sid]=d.addfrom.split("|"); addToCart(pid,sid);}
  else if(d.fav){state.fav.has(d.fav)?state.fav.delete(d.fav):state.fav.add(d.fav); toast(state.fav.has(d.fav)?t("tFavAdd"):t("tFavRem"));}
  else if(d.inc){state.cart[d.inc].q++;}
  else if(d.dec){state.cart[d.dec].q--; if(state.cart[d.dec].q<=0) delete state.cart[d.dec];}
  else if(d.clear!==undefined){state.cart={};toast(t("tCleared"));}
  else if(d.moveall){Object.keys(state.cart).forEach(pid=>state.cart[pid].s=d.moveall);toast(t("tMoved",{s:STORE[d.moveall].name}));}
  else if(d.optimize!==undefined){Object.keys(state.cart).forEach(pid=>state.cart[pid].s=cheapestSid(PROD[pid]));toast(t("tOpt"));}
  else if(d.checkout){startCheckout(d.checkout);return;}
  else if(d.store){
    if(state.stores.has(d.store)){ if(state.stores.size>1) state.stores.delete(d.store); else {toast(t("tOneStore"));return;} }
    else state.stores.add(d.store);
    state.detailsOpen=true;
  }
  else if(d.storeAll!==undefined){STORES.forEach(s=>state.stores.add(s.id));state.detailsOpen=true;}
  else if(d.reset!==undefined){state.cat="all";state.brand=null;state.q="";state.onlyPromo=false;state.layout="list";document.getElementById("q").value="";}
  else if(b.id==="promoBtn"){state.onlyPromo=!state.onlyPromo;}
  else return;
  rerender();
});

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="sort"){state.sort=el.value;render();}
  else if(el.dataset.setstore){state.cart[el.dataset.setstore].s=el.value;rerender();}
  else if(state.co&&el.dataset.f==="city"){state.co.city=+el.value;}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){state.q=el.value; if(state.view!=="catalog"){state.view="catalog";} render(); return;}
  if(el.id==="storeQ"){state.storeQ=el.value; renderStoreList(); return;}
  if(state.co&&el.dataset.f){
    if(el.dataset.f==="phone"){const f=phoneFmt(phoneDigits(el.value)); el.value=f; state.co.phone=f;}
    else if(el.dataset.f!=="city") state.co[el.dataset.f]=el.value;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(openId) closeSheet(); else if(state.co&&state.co.step<4) closeCo();
});

/* Тема */
function currentDark(){const a=document.documentElement.dataset.theme;return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function applyThemeIcon(){document.getElementById("themeBtn").textContent=currentDark()?"☀️":"🌙"}
function toggleTheme(){document.documentElement.dataset.theme=currentDark()?"light":"dark";save("gd_theme",document.documentElement.dataset.theme);applyThemeIcon()}
const savedTheme=load("gd_theme",null); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
applyThemeIcon();

applyStatic();
render();
</script>
</body>
</html>
